[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "practical-db-textbook"
version = "0.3.1"
description = "A Practical Introduction to Databases, built with Sphinx and sphinx-touchbook."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Christopher Painter-Wakefield" },
]

[project.optional-dependencies]
docs = [
    "Sphinx>=8.1",
    "accessible-pygments",
    "sphinx-accessibility",
    "sphinx-copybutton",
    "sphinx-nefertiti",
    "sphinx-touchbook",
]
test = [
    "beautifulsoup4",
]
dev = [
    "tox>=4",
]

[tool.setuptools]
py-modules = []

