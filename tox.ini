[tox]
min_version = 4.0
env_list = tests

[testenv]
package = editable
extras = docs, test
changedir = {toxinidir}

[testenv:tests]
description = Build HTML and validate every SQL example and self-check answer
allowlist_externals = node
commands =
    python -m sphinx -E -b html -d build/doctrees/html src build/html --fail-on-warning
    python tests/check_build.py
    node tests/check_sql_examples.mjs

[testenv:browser]
description = Run the SQL checks and verify the interactive book in Chromium
allowlist_externals = node
pass_env = CHROME_PATH
commands =
    {[testenv:tests]commands}
    node tests/check_browser.mjs
